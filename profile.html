<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhayleHR – My Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Ubuntu:300,400,500,700');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Ubuntu', sans-serif; }
        body { min-height: 100vh; background-color: ghostwhite; }

        .container1 {
            display: grid; grid-template-columns: 220px 1fr;
            grid-template-rows: 63px 1fr; height: 100vh; overflow: hidden;
        }
        .container1 aside {
            background-color: #789ecb; grid-column: 1/2; grid-row: 1/3;
            display: grid; grid-template-rows: 63px 1fr; z-index: 50; transition: transform 0.3s ease;
        }
        .container1 aside > div:first-child { border-bottom: #6383a9 1px solid; border-right: #6383a9 1px solid; display: flex; align-items: center; }
        .container1 aside > div:last-child { border-right: #6383a9 1px solid; overflow-y: auto; padding-bottom: 20px; }
        .container1 aside div > h6 { font-size: 20px; color: white; padding-left: 14px; height: 100%; display: flex; align-items: center; }
        .container1 aside div > h3 { color: #00000055; font-size: 12px; padding: 12px 0 0 12px; text-transform: uppercase; letter-spacing: 0.06em; }
        .container1 aside div > div { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .container1 aside div > div > a {
            padding: 10px 12px; background-color: #6383a9; border-radius: 10px;
            width: 90%; margin: auto; color: white; text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25); transition: background 0.15s; display: block; font-size: 14px;
        }
        .container1 aside div > div > a:hover { background-color: #0d356260; }

        .container1 header {
            background-color: #789ecb; grid-column: 2/3; border-bottom: #6383a9 1px solid;
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
        }
        .container1 header h4 { font-size: 22px; color: #0d3462; }
        .container1 main {
            background-color: #fff; grid-column: 2/3;
            padding: clamp(14px,2.5vw,20px); overflow-y: auto;
        }
        .container1 main::-webkit-scrollbar { display: none; }

        .sidebar-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
        .sidebar-toggle span { display: block; width: 22px; height: 3px; background: white; border-radius: 3px; transition: all 0.3s; }
        .sidebar-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .sidebar-toggle.open span:nth-child(2) { opacity: 0; }
        .sidebar-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 40; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ── Profile cards ── */
        .profile-header {
            background: #c9d0e3; border-radius: 10px;
            padding: clamp(14px,2.5vw,18px) clamp(14px,2.5vw,20px);
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
            margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .profile-av {
            width: 56px; height: 56px; border-radius: 50%; background: #0d3462;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 500; color: white; flex-shrink: 0;
        }
        .profile-name { font-size: 16px; font-weight: 500; color: #0d3462; }
        .profile-role { font-size: 13px; color: #0d346280; margin-top: 3px; }
        .profile-org  { font-size: 12px; color: #6383a9; margin-top: 5px; }
        .btn-edit { margin-left: auto; padding: 6px 18px; background: #0d3462; color: white; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: 'Ubuntu',sans-serif; white-space: nowrap; }

        .settings-card { background: #c9d0e3; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .settings-label { font-size: 11px; font-weight: 500; color: #0d346270; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #6383a930; gap: 12px; }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 14px; color: #0d3462; }
        .setting-sub   { font-size: 12px; color: #0d346270; margin-top: 2px; }
        .toggle { width: 34px; height: 20px; border-radius: 99px; background: #0d3462; position: relative; cursor: pointer; flex-shrink: 0; }
        .toggle.off { background: #789ecb; }
        .toggle::after { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: white; top: 2px; left: 16px; transition: left 0.2s; }
        .toggle.off::after { left: 2px; }

        .invite-section { background: #c9d0e3; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .invite-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
        .invite-title { font-size: 14px; font-weight: 500; color: #0d3462; }
        .invite-sub   { font-size: 12px; color: #0d346270; margin-top: 2px; }
        .active-badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; background: #0d3462; color: white; font-weight: 500; white-space: nowrap; }
        .invite-code-box { background: #6383a9; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .invite-code { font-size: clamp(14px, 2.5vw, 18px); font-weight: 500; letter-spacing: 0.1em; color: white; }
        .btn-copy { padding: 5px 14px; background: #0d3462; color: white; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: 'Ubuntu',sans-serif; white-space: nowrap; }

        .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-action { flex: 1; min-width: 120px; padding: 10px; border-radius: 10px; font-size: 14px; cursor: pointer; font-family: 'Ubuntu',sans-serif; border: none; background: #6383a9; color: white; transition: background 0.15s; }
        .btn-action:hover { background: #4e6a8a; }
        .btn-danger { background: #0d3462; }
        .btn-danger:hover { background: #071d36; }

        @media (max-width: 1024px) { .container1 { grid-template-columns: 185px 1fr; } }
        @media (max-width: 768px) {
            .container1 { grid-template-columns: 1fr; }
            .container1 aside { position: fixed; top: 0; left: -240px; width: 230px; height: 100vh; grid-row: unset; }
            .container1 aside.open { transform: translateX(240px); }
            .container1 header, .container1 main { grid-column: 1; }
            .sidebar-toggle { display: flex; }
        }
        @media (max-width: 480px) {
            .profile-header { flex-direction: column; text-align: center; }
            .btn-edit { margin: 0 auto; }
        }
    </style>
</head>
<body>
<div class="sidebar-overlay" id="overlay"></div>
<section class="container1">
    <aside id="sidebar">
        <div><h6>Khayle<span style="color:#0d3462;">HR</span></h6></div>
        <div>
            <div>
                <h3>Getting Started</h3>
                <div>
                    <a href="welcome.html">Welcome</a>
                    <a href="Invitation.html">Invitation</a>
                    <a href="createteam.html">Create Team</a>
                </div>
            </div>
            <div>
                <h3>Account</h3>
                <div><a href="profile.html" style="background-color:#0d3462;">My profile</a></div>
            </div>
        </div>
    </aside>
    <header>
        <button class="sidebar-toggle" id="sidebarToggle"><span></span><span></span><span></span></button>
        <h4>My Profile</h4>
        <div style="width:30px;"></div>
    </header>
    <main>
        <div class="profile-header">
            <div class="profile-av">NU</div>
            <div>
                <div class="profile-name">New User</div>
                <div class="profile-role">Role</div>
                <div class="profile-org">⬛ Organization</div>
            </div>
            <button class="btn-edit">Edit profile</button>
        </div>

        <div class="settings-card">
            <div class="settings-label">Notifications</div>
            <div class="setting-row">
                <div>
                    <div class="setting-label">New announcements</div>
                    <div class="setting-sub">Notify me when we receive an invite</div>
                </div>
                <div class="toggle" onclick="this.classList.toggle('off')"></div>
            </div>
        </div>

        <div class="invite-section">
            <div class="invite-section-header">
                <div>
                    <div class="invite-title">Invite a colleague</div>
                    <div class="invite-sub">Share your workspace code</div>
                </div>
                <span class="active-badge">Active</span>
            </div>
            <div class="invite-code-box">
                <div class="invite-code">ABC-DEF-1234</div>
                <button class="btn-copy" onclick="copyCode(this)">Copy code</button>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-action">Change password</button>
            <button class="btn-action btn-danger" onclick="window.location.href='home.html'">Log out</button>
        </div>
    </main>
</section>
<script>
    const toggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    function openSidebar()  { sidebar.classList.add('open'); overlay.classList.add('active'); toggle.classList.add('open'); document.body.style.overflow='hidden'; }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); toggle.classList.remove('open'); document.body.style.overflow=''; }
    toggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
    overlay.addEventListener('click', closeSidebar);
    function copyCode(btn) { navigator.clipboard.writeText('ABC-DEF-1234').then(() => { btn.textContent='Copied!'; setTimeout(() => btn.textContent='Copy code', 2000); }); }
</script>
</body>
</html>
